# Staging — branch `staging` → namespace `staging` → tag `staging-<sha>` → helm/values-staging.yaml

replicaCount: 2

resources:
  limits:
    cpu: 150m
    memory: 112Mi
  requests:
    cpu: 50m
    memory: 64Mi

podAnnotations:
  environment: staging

service:
  type: LoadBalancer

ingress:
  enabled: false
  className: nginx
  hosts:
    - host: app-staging.mergeai.in
      paths:
        - path: /
          pathType: Prefix

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
