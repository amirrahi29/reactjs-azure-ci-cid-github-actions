# UAT — branch `uat` → namespace `uat` → image tag `uat-<sha>` → helm/values-uat.yaml
# Push `uat` par: .github/workflows/chat-app.yml → ACR → helm upgrade -f helm/values-uat.yaml

replicaCount: 2

resources:
  limits:
    cpu: 250m
    memory: 160Mi
  requests:
    cpu: 50m
    memory: 80Mi

podAnnotations:
  environment: uat

service:
  type: LoadBalancer

ingress:
  enabled: false
  className: nginx
  hosts:
    - host: app-uat.mergeai.in
      paths:
        - path: /
          pathType: Prefix

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
