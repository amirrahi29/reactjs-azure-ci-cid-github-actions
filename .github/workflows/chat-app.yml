# Multi-env: dev / staging / uat branches → same AKS cluster, alag namespace + alag image tag + helm/values-<env>.yaml
name: Build, Push & Deploy to AKS

on:
  push:
    branches:
      - dev
      - staging
      - uat

env:
  ACR_NAME: chatappregsistry
  IMAGE_NAME: chat-app
  FRONTEND_IMAGE_NAME: frontend-app
  AKS_CLUSTER_NAME: ChatAppCluster
  AKS_RESOURCE_GROUP: ChatResourceGroup

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      namespace: ${{ steps.meta.outputs.namespace }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set image tag and namespace
        id: meta
        run: |
          BRANCH=${GITHUB_REF#refs/heads/}
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "IMAGE_TAG=${BRANCH}-${SHORT_SHA}" >> $GITHUB_ENV
          echo "image_tag=${BRANCH}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "namespace=${BRANCH}" >> $GITHUB_OUTPUT

      - name: Login to ACR
        run: az acr login --name $ACR_NAME

      - name: Build backend image (API)
        run: |
          echo "Building: $ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG"
          docker build -t $ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG .

      - name: Build frontend image (React + nginx)
        run: |
          echo "Building: $ACR_NAME.azurecr.io/$FRONTEND_IMAGE_NAME:$IMAGE_TAG"
          docker build -f frontend-app/Dockerfile -t $ACR_NAME.azurecr.io/$FRONTEND_IMAGE_NAME:$IMAGE_TAG frontend-app

      - name: Push images to ACR
        run: |
          docker push $ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG
          docker push $ACR_NAME.azurecr.io/$FRONTEND_IMAGE_NAME:$IMAGE_TAG

      - name: Image summary
        run: |
          echo "Pushed API: $ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG"
          echo "Pushed UI: $ACR_NAME.azurecr.io/$FRONTEND_IMAGE_NAME:$IMAGE_TAG"

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS kubeconfig
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Helm upgrade API (chat-app)
        run: |
          NS='${{ needs.build-and-push.outputs.namespace }}'
          helm upgrade --install chat-app ./helm \
            --namespace "$NS" \
            --create-namespace \
            -f "helm/values-${NS}.yaml" \
            --set image.repository=${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }} \
            --set image.tag=${{ needs.build-and-push.outputs.image_tag }} \
            --wait --timeout 5m

      - name: Helm upgrade UI (frontend-app)
        run: |
          NS='${{ needs.build-and-push.outputs.namespace }}'
          helm upgrade --install frontend-app ./helm-frontend \
            --namespace "$NS" \
            --create-namespace \
            -f "helm-frontend/values-${NS}.yaml" \
            --set image.repository=${{ env.ACR_NAME }}.azurecr.io/${{ env.FRONTEND_IMAGE_NAME }} \
            --set image.tag=${{ needs.build-and-push.outputs.image_tag }} \
            --wait --timeout 5m

      - name: Deploy summary
        run: |
          echo "Environment: ${{ needs.build-and-push.outputs.namespace }}"
          echo "Namespace: ${{ needs.build-and-push.outputs.namespace }}"
          echo "API chart: ./helm  |  UI chart: ./helm-frontend"
          echo "Tag: ${{ needs.build-and-push.outputs.image_tag }}"
